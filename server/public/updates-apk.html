<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WaitNot Captain — Update</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; color: #111; margin-bottom: 8px; }
    .version { font-size: 13px; color: #888; margin-bottom: 16px; }
    .notes {
      font-size: 14px;
      color: #555;
      background: #f3f4f6;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 24px;
      text-align: left;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: #EF4444;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      transition: background 0.2s;
    }
    .btn:active { background: #dc2626; }
    .btn:disabled { background: #fca5a5; cursor: not-allowed; }
    .btn-secondary {
      background: none;
      color: #666;
      border: 1px solid #e5e7eb;
      font-size: 14px;
      font-weight: 400;
    }
    .status {
      font-size: 13px;
      color: #6b7280;
      margin-top: 12px;
      min-height: 20px;
    }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚀</div>
    <h1 id="title">Update Available</h1>
    <p class="version" id="version-text">Loading...</p>
    <div class="notes" id="notes">Fetching update info...</div>
    <button class="btn" id="update-btn" onclick="applyUpdate()">
      Update Now
    </button>
    <button class="btn btn-secondary" id="later-btn" onclick="goBack()">
      Remind Me Later
    </button>
    <p class="status" id="status"></p>
  </div>

  <script>
    const API = 'https://waitnot-restaurant1.onrender.com';

    async function loadVersionInfo() {
      try {
        const res = await fetch(`${API}/api/app-version`);
        const data = await res.json();
        document.getElementById('version-text').textContent = `Version ${data.version}`;
        document.getElementById('notes').textContent = data.releaseNotes || 'Improvements and fixes.';
        if (data.forceUpdate) {
          document.getElementById('later-btn').style.display = 'none';
        }
      } catch (_) {
        document.getElementById('notes').textContent = 'Could not load update info. Check your connection.';
      }
    }

    function applyUpdate() {
      const btn = document.getElementById('update-btn');
      const status = document.getElementById('status');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Updating...';
      status.textContent = 'Clearing cache and reloading app...';

      // Clear all caches
      if ('caches' in window) {
        caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k))));
      }

      // Clear localStorage version marker
      localStorage.removeItem('app_version_dismissed');

      // Force hard reload after short delay
      setTimeout(() => {
        // Redirect to app root with cache-busting param
        window.location.href = `${API}/?v=${Date.now()}`;
      }, 800);
    }

    function goBack() {
      // Dismiss and go back to the app
      localStorage.setItem('app_version_dismissed', Date.now());
      window.location.href = `${API}/`;
    }

    loadVersionInfo();
  </script>
</body>
</html>
