name: Build iOS IPA

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: client

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build captain web app
        run: npm run build:captain

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        run: sudo gem install cocoapods
        working-directory: .

      - name: Install pods
        run: pod install --repo-update
        working-directory: client/ios/App

      - name: Build & Archive (unsigned)
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/WaitNot-Captain.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true
        working-directory: client/ios/App

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "$RUNNER_TEMP/WaitNot-Captain.xcarchive/Products/Applications/App.app" Payload/
          zip -r WaitNot-Captain.ipa Payload/
          echo "IPA created: $(du -sh WaitNot-Captain.ipa)"
        working-directory: client/ios/App

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WaitNot-Captain-iOS
          path: client/ios/App/WaitNot-Captain.ipa
          retention-days: 30
