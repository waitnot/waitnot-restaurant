name: Build Captain APK

on:
  push:
    branches: [main]
    paths:
      - 'client/src/**'
      - 'client/vite.captain.config.js'
      - 'client/index-captain.html'
      - '.github/workflows/build-captain-apk.yml'
  workflow_dispatch: # allow manual trigger

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: client

      - name: Build captain web app
        run: npm run build:captain
        working-directory: client

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android --capacitorconfig capacitor.captain.json
        working-directory: client

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: client/android

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: client/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaitNot-Captain-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
