name: Build Captain iOS

on:
  push:
    branches: [main]
    paths:
      - 'client/src/**'
      - 'client/ios/**'
      - 'client/vite.captain.config.js'
      - 'client/index-captain.html'
      - 'client/package.json'
      - '.github/workflows/build-captain-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: client

      - name: Build captain web app
        run: npm run build:captain
        working-directory: client

      - name: Swap to captain capacitor config
        run: cp capacitor.captain.json capacitor.config.json
        working-directory: client

      - name: Sync Capacitor iOS
        run: npx cap sync ios
        working-directory: client

      - name: Ensure xcconfig and SPM source files exist
        working-directory: client
        run: |
          [ -f ios/debug.xcconfig ] || printf 'CAPACITOR_DEBUG = true\n' > ios/debug.xcconfig
          [ -f ios/release.xcconfig ] || printf 'CAPACITOR_DEBUG = false\n' > ios/release.xcconfig
          mkdir -p ios/App/CapApp-SPM/Sources/CapApp-SPM
          [ -f ios/App/CapApp-SPM/Sources/CapApp-SPM/CapAppSPM.swift ] || printf '// Required by SPM\nimport Foundation\n' > ios/App/CapApp-SPM/Sources/CapApp-SPM/CapAppSPM.swift

      - name: Install CocoaPods dependencies
        run: pod install --repo-update
        working-directory: client/ios/App

      - name: Build iOS archive (unsigned)
        working-directory: client/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ../../build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive 2>&1 | tail -60

      - name: Package IPA from archive
        working-directory: client
        run: |
          APP_PATH=$(find build/App.xcarchive -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r WaitNot-Captain-iOS.ipa Payload/
          echo "IPA created successfully"

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: WaitNot-Captain-iOS
          path: client/build/WaitNot-Captain-iOS.ipa
          retention-days: 30
