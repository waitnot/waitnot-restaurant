name: Build Captain iOS

on:
  push:
    branches: [main]
    paths:
      - 'client/src/**'
      - 'client/ios/**'
      - 'client/vite.captain.config.js'
      - 'client/index-captain.html'
      - 'client/package.json'
      - '.github/workflows/build-captain-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: client

      - name: Build captain web app
        run: npm run build:captain
        working-directory: client

      - name: Swap to captain capacitor config
        run: cp capacitor.captain.json capacitor.config.json
        working-directory: client

      - name: Sync Capacitor iOS
        run: npx cap sync ios
        working-directory: client

      - name: Ensure xcconfig files exist
        working-directory: client/ios
        run: |
          [ -f debug.xcconfig ]   || printf 'CAPACITOR_DEBUG = true\n'  > debug.xcconfig
          [ -f release.xcconfig ] || printf 'CAPACITOR_DEBUG = false\n' > release.xcconfig

      - name: Fix SPM package - add source file and path
        working-directory: client/ios/App/CapApp-SPM
        run: |
          mkdir -p Sources/CapApp-SPM
          printf '// Required by SPM\nimport Foundation\n' > Sources/CapApp-SPM/CapAppSPM.swift
          cat > Package.swift << 'SWIFTEOF'
// swift-tools-version: 5.9
import PackageDescription
let package = Package(
  name: "CapApp-SPM",
  platforms: [.iOS(.v15)],
  products: [.library(name: "CapApp-SPM", targets: ["CapApp-SPM"])],
  dependencies: [
    .package(url: "https://github.com/ionic-team/capacitor-swift-pm.git", exact: "8.5.0"),
    .package(url: "https://github.com/firebase/firebase-ios-sdk.git", from: "11.0.0")
  ],
  targets: [
    .target(
      name: "CapApp-SPM",
      dependencies: [
        .product(name: "Capacitor", package: "capacitor-swift-pm"),
        .product(name: "Cordova", package: "capacitor-swift-pm"),
        .product(name: "FirebaseMessaging", package: "firebase-ios-sdk"),
        .product(name: "FirebaseCore", package: "firebase-ios-sdk")
      ],
      path: "Sources/CapApp-SPM"
    )
  ]
)
SWIFTEOF

      - name: Install CocoaPods dependencies
        run: pod install --repo-update
        working-directory: client/ios/App

      - name: Build iOS archive (unsigned)
        working-directory: client/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ../../build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive 2>&1 | tail -80

      - name: Package IPA from archive
        working-directory: client
        run: |
          APP_PATH=$(find build/App.xcarchive -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r WaitNot-Captain-iOS.ipa Payload/
          echo "IPA created successfully"

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: WaitNot-Captain-iOS
          path: client/build/WaitNot-Captain-iOS.ipa
          retention-days: 30
