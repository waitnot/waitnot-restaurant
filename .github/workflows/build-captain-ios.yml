name: Build Captain iOS

on:
  push:
    branches: [main]
    paths:
      - 'client/src/**'
      - 'client/ios/**'
      - 'client/vite.captain.config.js'
      - 'client/index-captain.html'
      - 'client/package.json'
      - '.github/workflows/build-captain-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: client

      - name: Build captain web app
        run: npm run build:captain
        working-directory: client

      - name: Swap to captain capacitor config
        run: cp capacitor.captain.json capacitor.config.json
        working-directory: client

      - name: Sync Capacitor iOS
        run: npx cap sync ios
        working-directory: client

      - name: Ensure xcconfig files exist
        working-directory: client/ios
        run: |
          # Write xcconfig files — always include the CocoaPods-generated xcconfig
          printf '#include "Pods/Target Support Files/Pods-App/Pods-App.debug.xcconfig"\n\nCAPACITOR_DEBUG = true\n' > debug.xcconfig
          printf '#include "Pods/Target Support Files/Pods-App/Pods-App.release.xcconfig"\n\nCAPACITOR_DEBUG = false\n' > release.xcconfig

      - name: Add GoogleService-Info.plist from secret
        run: |
          if [ -n "$GSERVICE_PLIST" ]; then
            echo "$GSERVICE_PLIST" | base64 --decode > client/ios/App/App/GoogleService-Info.plist
          fi
        env:
          GSERVICE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Fix SPM package
        run: |
          cp .github/workflows/Package.swift client/ios/App/CapApp-SPM/Package.swift

      - name: Install CocoaPods dependencies
        run: pod install --repo-update --clean-install
        working-directory: client/ios/App

      - name: Build iOS archive (unsigned)
        working-directory: client/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ../../build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive 2>&1 | tee /tmp/xbuild.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== BUILD ERRORS ==="
            grep -E "error:|warning:.*error" /tmp/xbuild.log | head -40
            exit 65
          fi

      - name: Package IPA from archive
        working-directory: client
        run: |
          APP_PATH=$(find build/App.xcarchive -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r WaitNot-Captain-iOS.ipa Payload/
          echo "IPA created successfully"

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: WaitNot-Captain-iOS
          path: client/build/WaitNot-Captain-iOS.ipa
          retention-days: 30
